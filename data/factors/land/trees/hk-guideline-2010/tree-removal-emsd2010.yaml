notes:
  zh-Hant: 這是吸收量：每棵新種樹木每年從大氣移除約 23 公斤二氧化碳。指引算法：（種植數 − 移除數）× 23 ÷ 1000 × 報告期年數 = 公噸。指引註明此預設值按香港位置、林地類型及估計樹木密度建議，適用於香港常見、可長到最少 5 米高的樹木。
  en: This is a removal. Each newly planted tree removes about 23 kg of CO2 a year. Guidelines method — (trees planted - trees removed) x 23 / 1000 x years in the reporting period = tonnes. The guidelines say the default reflects Hong Kong's location, woodland types and estimated tree density, and applies to trees common in Hong Kong that can reach at least 5 metres.
