notes:
  zh-Hant: 財政年度 2019/20（4 月至翌年 3 月）。渠務署處理污水所用電力的排放，按食水用量（立方米）計算。範本的預設用法：一般商業、住宅及機構用途按 100% 食水進入污水系統（×1.0）；食肆及飲食服務按 70%（×0.7）。範本註明數值按渠務署可持續發展報告每年更新。
  en: Financial year 2019/20 (April to March). Emissions from the electricity the Drainage Services Department uses to treat sewage, per cubic metre of fresh water used. Template default — other commercial, residential and institutional premises assume 100% of fresh water enters the sewer (x1.0); restaurants and catering 70% (x0.7). The template notes the factor is updated each year from the DSD Sustainability Report.
