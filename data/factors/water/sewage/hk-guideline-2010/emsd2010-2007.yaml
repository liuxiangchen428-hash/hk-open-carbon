notes:
  zh-Hant: 歷史數據：只用於核算當年的排放。按食水用量（立方米）計算；指引的預設用法：食肆及飲食服務 × 0.7，其他商業、住宅及機構用途 × 1.0。指引的算法是單位用電量 × 全港預設值 0.7 kg/kWh。年份按指引表頭照錄（指引未註明是否財政年度）。
  en: Historical data — use only for emissions in that year. Per cubic metre of fresh water used; the guidelines apply x0.7 for restaurants and catering and x1.0 for other commercial, residential and institutional uses. The guidelines compute it as unit electricity use x the territory-wide default of 0.7 kg/kWh. Years as printed in the table header (the guidelines do not say whether they are financial years).
