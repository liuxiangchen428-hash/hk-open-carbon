notes:
  zh-Hant: 冷氣及製冷設備洩漏每公斤冷媒相當的二氧化碳排放（即 GWP）。用法：洩漏量 =（期初存量 + 購入 − 妥善處置 − 期末存量），排放 = 洩漏量 × GWP。數值來源：世界資源研究所（2005）HFC 及 PFC 排放計算指南，引用 ASHRAE 34 標準。
  en: CO2-equivalent emissions per kg of refrigerant leaked (the GWP). Leakage = stock at start + purchased - disposed responsibly - stock at end; emissions = leakage x GWP. Value source - World Resources Institute (2005) HFC/PFC calculation guide, citing ASHRAE Standard 34.
