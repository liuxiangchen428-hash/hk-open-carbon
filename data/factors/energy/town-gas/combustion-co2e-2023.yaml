notes:
  zh-Hant: 煤氣公司公佈的用戶端燃燒排放，每單位煤氣 2.553 kg CO2e（亦列為每度 0.19 kg CO2e）。與 2010 年指引的燃燒系數（CO2 2.549 kg/單位，另加少量 CH4、N2O）相近。生產加燃燒合計每單位 3.102 kg CO2e。
  en: Customer-side combustion emissions published by the Hong Kong and China Gas Company, 2.553 kg CO2e per unit (also 0.19 kg CO2e/kWh). Close to the 2010 guidelines' combustion factor (CO2 2.549 kg/unit plus small CH4 and N2O). Production plus combustion is 3.102 kg CO2e per unit.
