notes:
  zh-Hant: 歷史數據：只用於核算當年的排放；核算近年排放請用最新年份的系數。只計煤氣公司生產煤氣的排放（數據由煤氣公司提供，載於 2010 年指引）。煤氣 1 單位 = 48 兆焦耳。在建築物內燃燒煤氣的直接排放須另按燃燒系數計算（範圍 1）。
  en: Historical data — use only for emissions in that year; use the latest year's factor for recent years. Covers only emissions from producing towngas, as supplied by the Hong Kong and China Gas Company and printed in the 2010 guidelines. One unit = 48 MJ. Direct emissions from burning towngas on site are calculated separately with the combustion factors (scope 1).
