  zh-Hant: 煤氣公司公佈的香港煤氣生產環節排放，每單位煤氣 0.534 kg CO2e（亦列為每度 0.04 kg CO2e）。煤氣 1 單位 = 48 兆焦耳。對應 2010 年指引表 6 的「購買煤氣」間接排放；在建築物內燃燒煤氣的排放須另計（範圍 1）。
  en: Emissions from producing town gas in Hong Kong as published by the Hong Kong and China Gas Company, 0.534 kg CO2e per unit (also given as 0.04 kg CO2e/kWh). One unit = 48 MJ. Same scope as the purchased-towngas factor in Table 6 of the 2010 guidelines; on-site combustion is counted separately (scope 1).
