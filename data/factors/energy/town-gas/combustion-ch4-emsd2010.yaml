notes:
  zh-Hant: 香港機電署及環保署 2010 年建築物溫室氣體指引的本地系數，適用於固定燃燒源。 煤氣 1 單位 = 48 兆焦耳（煤氣錶讀數）。此為在建築物內燃燒煤氣的直接排放（範圍 1）；煤氣生產過程的間接排放另計。 指引換算 CO2e 時採用 CH4 GWP 21、N2O GWP 310（IPCC 第二次評估報告）。
  en: Local factor from the 2010 EMSD/EPD building GHG guidelines, for stationary combustion. One towngas unit = 48 MJ (gas meter reading). Direct emissions from burning towngas on site (scope 1); emissions from producing towngas are counted separately. The guidelines convert to CO2e with GWP 21 for CH4 and 310 for N2O (IPCC Second Assessment).
