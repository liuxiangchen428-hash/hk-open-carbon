  en: Emissions from producing town gas in Hong Kong as published by the Hong Kong and China Gas Company, 0.548 kg CO2e per unit (also given as 0.04 kg CO2e/kWh). One unit = 48 MJ. Same scope as the purchased-towngas factor in Table 6 of the 2010 guidelines; on-site combustion is counted separately (scope 1).
