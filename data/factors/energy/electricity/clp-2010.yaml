  zh-Hant: 中電香港的二氧化碳當量排放強度（包括二氧化碳及其他主要溫室氣體）。報告的口徑是「每售出一度電（包括核電）」。報告未註明是否扣除可再生能源證書（當年中電未有出售證書）。適用於中電供電區的範圍 2 核算。
  en: CLP Power Hong Kong CO2-equivalent intensity (CO2 and other material greenhouse gases). The report gives it per kWh of electricity sold including nuclear power. It does not mention Renewable Energy Certificates (CLP did not sell them at the time). Use for scope 2 in the CLP supply area.
