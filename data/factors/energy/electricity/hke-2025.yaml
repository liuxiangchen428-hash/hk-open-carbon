  zh-Hant: 港燈範圍 1 加範圍 2 排放除以售電量。適用於港島、鴨脷洲及南丫島（港燈供電區）的範圍 2 核算。港燈 2025 年報告的溫室氣體核算方法（PDF 第 127 頁，報告第 125 頁）註明由 2025 年起採用 IPCC 第五次評估報告（AR5）的 GWP；之前年份的報告未註明。
  en: HK Electric scope 1 plus scope 2 emissions per unit of electricity sold. Use for scope 2 in the HK Electric supply area (Hong Kong Island, Ap Lei Chau, Lamma). The GHG accounting methodology in the 2025 report (PDF p.127, report p.125) says HK Electric adopted IPCC AR5 GWP values that year ("Changes from the prior year"); earlier reports do not say.
