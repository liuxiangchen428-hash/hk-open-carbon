notes:
  zh-Hant: 指引建議兩種做法：用全港預設值 0.7 kg/kWh，或用電力公司公佈的當年系數。指引也用此值推算食水及污水處理的系數（表 8、表 9）。有電力公司當年系數時應優先使用。
  en: The guidelines allow either this territory-wide default or the power company's own factor for the year. They also use it to derive the fresh water and sewage factors (Tables 8 and 9). Prefer the company's factor for the year when available.
