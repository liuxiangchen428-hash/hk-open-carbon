notes:
  zh-Hant: 推算值：載通國際巴士總排放（範圍 1）除以九巴加龍運的乘客人次。總排放可能包括集團的非專營巴士，結果或會略為偏高。只計巴士燃料（不含車站、車廠用電）。乘客乘搭巴士屬範圍 3。
  en: Derived value. TIH bus scope 1 emissions divided by KMB plus LWB passenger trips. Total emissions may include the group's non-franchised buses, so the result may be slightly high. Bus fuel only (excludes depot and station electricity). For passengers this is scope 3.
